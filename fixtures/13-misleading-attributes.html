<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Attributes point at the wrong field</title>
<style>body{font:15px Arial;margin:24px}label,td,.lbl{color:#222}input,select{padding:6px;margin:4px}.row{margin:8px 0}
.hide{display:none}table td{padding:4px 12px}</style></head><body>
<h2>Attributes point at the wrong field</h2>

<form>
 <div class="row"><label for="lastName">First Name</label> <input id="lastName" name="surname" class="last" type="text" data-expect="first-name"></div>
 <div class="row"><label for="firstName">Last Name</label> <input id="firstName" name="fname" class="first" type="text"></div>
 <div class="row">Gender <input type="radio" id="female" name="gender" value="Female" data-expect="gender-male"> <label for="female">Male</label>
   <input type="radio" id="male" name="gender" value="Male"> <label for="male">Female</label></div>
 <div class="row"><label for="country">State</label> <select id="country" name="country" data-expect="state"><option value="">-- Select State --</option><option value="AL">Alabama</option><option value="CA">California</option><option value="FL">Florida</option><option value="KA">Karnataka</option><option value="PU">Punjab</option><option value="TE">Texas</option><option value="WA">Washington</option></select></div>
</form>
</body></html>
