<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Form appears after 2 seconds</title>
<style>body{font:15px Arial;margin:24px}label,td,.lbl{color:#222}input,select{padding:6px;margin:4px}.row{margin:8px 0}
.hide{display:none}table td{padding:4px 12px}</style></head><body>
<h2>Form appears after 2 seconds</h2>

<div id="mount">Loading...</div>
<script>setTimeout(()=>{document.getElementById('mount').innerHTML=`<div class="row"><label>State <select data-expect="state"><option value="">-- Select State --</option><option value="AL">Alabama</option><option value="CA">California</option><option value="FL">Florida</option><option value="KA">Karnataka</option><option value="PU">Punjab</option><option value="TE">Texas</option><option value="WA">Washington</option></select></label></div>
<div class="row"><label>First Name <input type="text" data-expect="first-name"></label></div>
<div class="row">Gender: <label><input type="radio" name="z" data-expect="gender-male"> Male</label> <label><input type="radio" name="z"> Female</label></div>`},2000);</script>
</body></html>
